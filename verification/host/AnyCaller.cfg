\* The adapter alone, under any caller its types allow: a Plan is a frozen
\* value nothing consumes, so it may be published again, on the same base, from
\* another fork. The shipped hosts publish each Plan once, a subset of these runs.
SPECIFICATION Spec
CONSTANTS
    Branches = {b1, b2}
    MaxKey = 3
    MaxPlans = 4
    MaxGid = 4
    Contents = {"x", "y"}
    Offsets = {0, 1}
    Heights = {1, 2}
INVARIANTS
    NoRegress
    StaleHitsDrop
